<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Profile · LPFAP</title>
  <link rel="icon" type="image/avif" href="/img/pet-logo-design-paw-vector-animal-shop-business_53876-136741.avif">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<nav id="topNav"></nav>

<div class="inner-page">
  <div class="page-heading">My Profile</div>
  <div class="page-subheading">View and update your personal information.</div>
  <div class="profile-grid">
    <div>
      <div class="profile-card">
        <div class="profile-avatar-big" id="profileAvatarBig">?</div>
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-email" id="profileEmail">—</div>
        <div id="profileRoleBadge"></div>
        <div class="profile-stats" id="profileStats"></div>
      </div>
      <div class="card-panel" style="margin-top:16px">
        <div class="card-panel-header"><div class="card-panel-title">Account Info</div></div>
        <div style="padding:4px 0" id="profileInfoRows"></div>
      </div>
    </div>
    <div class="profile-form-card">
      <div class="profile-form-title">Account Settings</div>

      <div class="form-group">
        <label class="form-label">Profile Picture</label>
        <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
          <img id="avatarPreview" alt="Avatar"
               style="width:72px;height:72px;border-radius:50%;object-fit:cover;background:#f1f5f9;border:1px solid #e2e8f0">
          <div style="flex:1;min-width:220px">
            <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
              <label class="btn btn-outline btn-sm" style="cursor:pointer;margin:0">
                📁 Upload photo
                <input id="avatarFile" type="file" accept="image/*"
                       style="display:none" onchange="uploadAvatar(event)">
              </label>
              <button class="btn btn-outline btn-sm" type="button" onclick="clearAvatar()">Remove</button>
              <span id="avatarUploadStatus" style="font-size:12px;color:#64748b;align-self:center"></span>
            </div>
            <input class="form-input" id="editAvatarUrl" type="text"
                   placeholder="…or paste an image URL"
                   oninput="updateAvatarPreview()">
            <div style="font-size:11px;color:#94a3b8;margin-top:6px">…or pick from our gallery:</div>
            <div id="avatarPicker"
                 style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"></div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-input" id="editName" type="text" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input class="form-input" id="editPhone" type="text" placeholder="+48 123 456 789">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">About me / Bio
          <span style="font-weight:400;color:#94a3b8;font-size:11px;margin-left:6px">optional · max 2000 chars</span>
        </label>
        <textarea class="form-textarea" id="editBio" rows="4"
                  placeholder="Tell shelters a bit about yourself — your home, experience with animals, what you're looking for…"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-input input-readonly" id="editEmail" type="email">
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <input class="form-input input-readonly" id="editRole" type="text">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Member Since</label>
        <input class="form-input input-readonly" id="editSince" type="text">
      </div>

      <div style="margin-top:8px;display:flex;gap:10px">
        <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
        <button class="btn btn-outline" onclick="load()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/core.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/page-profile.js"></script>
</body>
</html>
